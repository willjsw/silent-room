- 이슈 조회는 `.ai/forge.md` 의 **읽기** 명령만. 이슈·리뷰 요청·댓글을 만들지 않는다
- Bash 는 조회용이다. 파일을 고치는 명령(`sed -i`, 리다이렉션, `tee`, heredoc 쓰기)을 쓰지 않는다
- 커밋·push 를 하지 않는다
