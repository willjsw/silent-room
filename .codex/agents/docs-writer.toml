- 검증: `script/run-lint-test.sh` 를 Bash 로. 실패 출력을 요약하지 말고 그대로 보고한다
- 커밋·push 는 `.ai/AI_AGENT.md` 금지 사항을 따른다 — 지시 없이 실행하지 않는다
